[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hugin-meetings"
version = "0.1.0"
description = "Record, transcribe, diarize, and summarize meetings. Part of the Hugin personal productivity stack."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "David Fendrich" }]
dependencies = [
    "hugin",
]

[project.optional-dependencies]
transcribe = [
    "huggingface-hub",
    "nemo_toolkit[asr]",
    # whisperx>=3.8 requires pyannote.audio>=4 (for the speaker-diarization
    # community-1 pipeline + token= kwarg used by transcribe/enroll) and
    # numpy>=2.1, and bundles its CUDA cuDNN 9 via torch's cu12 wheels. Older
    # whisperx (==3.3.1) pinned pyannote.audio==3.3.2, which cannot load
    # community-1 and broke speaker naming; do not pin back below 3.8.
    "numpy>=2.1",
    "pandas>=2.2,<3",
    "pyannote.audio>=4.0,<5",
    "torch>=2.8,<2.9",
    "torchaudio>=2.8,<2.9",
    "whisperx>=3.8,<3.9",
]
summarize-local = [
    "llama-cpp-python",
]

[project.scripts]
hugin-meet-record = "hugin_meetings.recording:main"
hugin-meet-context = "hugin_meetings.context:main"
hugin-meet-langid = "hugin_meetings.langid:main"
hugin-meet-transcribe = "hugin_meetings.transcribe:main"
hugin-meet-summarize = "hugin_meetings.summarize:main"
hugin-meet-enroll = "hugin_meetings.enroll:main"
hugin-meet-match-calendar = "hugin_meetings.calendar_match:main"
hugin-meet-tui = "hugin_meetings.tui:main"
hugin-meet-migrate-yyyy = "hugin_meetings.migrate_yyyy:main"
hugin-meet-slack-post = "hugin_meetings.slack_post:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hugin_meetings = ["prompts/*.md"]
